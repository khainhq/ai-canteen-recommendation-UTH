<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A8A;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background with gradient -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative glowing circles -->
  <circle cx="200" cy="150" r="80" fill="url(#glow1)"/>
  <circle cx="1000" cy="200" r="100" fill="url(#glow1)"/>
  <circle cx="300" cy="480" r="60" fill="url(#glow1)"/>
  <circle cx="900" cy="500" r="70" fill="url(#glow1)"/>

  <!-- AI Brain Icon -->
  <g transform="translate(600, 315)">
    <!-- Left hemisphere -->
    <ellipse cx="-85" cy="-50" rx="55" ry="60" fill="none" stroke="#A5B4FC" stroke-width="8"/>
    <!-- Right hemisphere -->
    <ellipse cx="85" cy="-50" rx="55" ry="60" fill="none" stroke="#A5B4FC" stroke-width="8"/>
    <!-- Connection arc -->
    <path d="M -90 -10 Q 0 30 90 -10" fill="none" stroke="#A5B4FC" stroke-width="8"/>

    <!-- Neural nodes left -->
    <circle cx="-60" cy="-60" r="5" fill="#A5B4FC"/>
    <line x1="-60" y1="-60" x2="-40" y2="-60" stroke="#A5B4FC" stroke-width="4"/>
    <circle cx="-60" cy="-30" r="5" fill="#A5B4FC"/>
    <line x1="-60" y1="-30" x2="-40" y2="-30" stroke="#A5B4FC" stroke-width="4"/>

    <!-- Neural nodes right -->
    <circle cx="60" cy="-60" r="5" fill="#A5B4FC"/>
    <line x1="40" y1="-60" x2="60" y2="-60" stroke="#A5B4FC" stroke-width="4"/>
    <circle cx="60" cy="-30" r="5" fill="#A5B4FC"/>
    <line x1="40" y1="-30" x2="60" y2="-30" stroke="#A5B4FC" stroke-width="4"/>
  </g>

  <!-- Food Bowl Icon -->
  <g transform="translate(600, 315)">
    <!-- Bowl -->
    <path d="M -110 145 Q -110 220 0 220 Q 110 220 110 145" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
    <line x1="-110" y1="145" x2="110" y2="145" stroke="#F59E0B" stroke-width="10"/>

    <!-- Food items -->
    <ellipse cx="-20" cy="90" rx="35" ry="40" fill="#FCD34D"/>
    <ellipse cx="35" cy="85" rx="30" ry="35" fill="#FCD34D"/>
    <ellipse cx="0" cy="70" rx="28" ry="30" fill="#FBBF24"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FDE047">
    <!-- Top left -->
    <line x1="410" y1="175" x2="434" y2="175" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <line x1="422" y1="163" x2="422" y2="187" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="422" cy="175" r="3" fill="#FDE047"/>

    <!-- Top right -->
    <line x1="766" y1="175" x2="790" y2="175" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <line x1="778" y1="163" x2="778" y2="187" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="778" cy="175" r="3" fill="#FDE047"/>

    <!-- Left -->
    <line x1="398" y1="405" x2="422" y2="405" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <line x1="410" y1="393" x2="410" y2="417" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="410" cy="405" r="3" fill="#FDE047"/>

    <!-- Right -->
    <line x1="778" y1="405" x2="802" y2="405" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <line x1="790" y1="393" x2="790" y2="417" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="790" cy="405" r="3" fill="#FDE047"/>

    <!-- Top center -->
    <line x1="588" y1="155" x2="612" y2="155" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <line x1="600" y1="143" x2="600" y2="167" stroke="#FDE047" stroke-width="4" stroke-linecap="round"/>
    <circle cx="600" cy="155" r="3" fill="#FDE047"/>
  </g>

  <!-- Text -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    AI Canteen
  </text>
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="36" fill="#A5B4FC" text-anchor="middle">
    Smart Meal Recommendation System
  </text>
</svg>
